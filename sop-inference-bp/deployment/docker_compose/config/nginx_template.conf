worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # WebSocket proxy settings
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen ${NGINX_INGRESS_PORT};

        # API server
        location /v1/ {
            proxy_pass http://${API_SERVER_NAME}:${API_SERVER_PORT};
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            client_max_body_size ${NGINX_INGRESS_CLIENT_MAX_BODY_SIZE};
        }

        # demo web app
        location = ${DEMO_WEB_APP_ROOT_PATH} {
            return 301 ${DEMO_WEB_APP_ROOT_PATH}/;
        }

        location ${DEMO_WEB_APP_ROOT_PATH}/ {
            rewrite ${DEMO_WEB_APP_ROOT_PATH}/(.*) /$1 break;
            proxy_pass http://${DEMO_WEB_APP_NAME}:${DEMO_WEB_APP_PORT};

            proxy_request_buffering off;
            proxy_redirect off;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            client_max_body_size ${NGINX_INGRESS_CLIENT_MAX_BODY_SIZE};
        }

        # Swagger UI
        location /docs/ {
            # Note that we cannot have a slash at the end of the URL.
            proxy_pass http://${API_SERVER_NAME}:${API_SERVER_PORT}/docs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ReDoc
        location /redoc/ {
            # Note that we cannot have a slash at the end of the URL.
            proxy_pass http://${API_SERVER_NAME}:${API_SERVER_PORT}/redoc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /openapi.json {
            proxy_pass http://${API_SERVER_NAME}:${API_SERVER_PORT}/openapi.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
