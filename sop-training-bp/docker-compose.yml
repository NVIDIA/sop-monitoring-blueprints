version: '3.8'

services:
  # Data Generation Microservice
  sop-data-gen:
    image: ${SOP_DATA_GEN_IMAGE:-sop-data-generation:latest}
    build:
      context: ./microservices/data-generation-pipeline
      dockerfile: Dockerfile
    ports:
      - "${DATA_GEN_PORT:-5487}:${DATA_GEN_PORT:-5487}"
    volumes:
      - "${CONFIG_DIR:-config}:/workspace/assets/config"
      - "${DATASET_ROOT:-data}:/workspace/assets/data"
      - "${LOG_FILE_ROOT:-logs}:/workspace/assets/logs"
    environment:
      - NGC_PERSONAL_KEY=${NGC_API_KEY:-${NGC_PERSONAL_KEY:-}}
    restart: unless-stopped
    ipc: host
    networks:
      - sop-network
    depends_on:
      - annotation-backend
      - metadata_db

  cosmos-reason1-microservice:
    image: ${VLM_IMAGE:-cr1_ftms:latest}
    build:
      context: ./microservices/cr1_training_ms
      dockerfile: Dockerfile
    ports:
      - "${VLM_PORT:-32080}:${VLM_PORT:-32080}"
    volumes:
      - "${CONFIG_DIR:-config}:/workspace/sop-cr1-ftms/assets/config"
      - "${DATASET_ROOT:-data}:/workspace/sop-cr1-ftms/assets/data"
      - "${PRETRAINED_MODEL_ROOT:-pretrained_weights}:/workspace/sop-cr1-ftms/assets/weights"
      - "${RESULTS_ROOT:-results}:/workspace/sop-cr1-ftms/assets/results"
      - "${TOOL_PATH:-tools}:/workspace/sop-cr1-ftms/assets/tools"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped
    networks:
      - sop-network
    depends_on:
      - sop-data-gen
      - metadata_db

  ddm-training-microservice:
    image: ${DDM_IMAGE:-ddm_ftms:latest}
    build:
      context: ./microservices/ddm_training_ms
      dockerfile: Dockerfile
    ports:
      - "${DDM_PORT:-32100}:${DDM_PORT:-32100}"
    environment:
      - SERVICE_PORT=${DDM_PORT:-32100}
    volumes:
      - "${CONFIG_DIR:-config}:/workspace/sop-ddm-ftms/assets/config"
      - "${DATASET_ROOT:-data}:/workspace/sop-ddm-ftms/assets/data"
      - "${PRETRAINED_MODEL_ROOT:-pretrained_weights}:/workspace/sop-ddm-ftms/assets/weights"
      - "${RESULTS_ROOT:-results}:/workspace/sop-ddm-ftms/assets/results"
      - "${TOOL_PATH:-tools}:/workspace/sop-ddm-ftms/assets/tools"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped
    networks:
      - sop-network
    depends_on:
      - sop-data-gen
      - metadata_db

  annotation-backend:
    image: ${ANNOTATION_BACKEND_IMAGE:-sop-annotation-backend:latest}
    build:
      context: ./microservices/video-annotator-ms/annotation_backend
      dockerfile: Dockerfile
    container_name: sop-annotation-backend
    ports:
      - "${ANNOTATION_BACKEND_PORT:-8100}:${ANNOTATION_BACKEND_PORT:-8100}"
    volumes:
      - ${DATASET_ROOT:-data}:/app/assets/videos
      - ${LOG_FILE_PATH:-logs}:/app/assets/logs
    networks:
      - sop-network
    restart: unless-stopped
    depends_on:
      - metadata_db

  annotation-frontend:
    image: ${ANNOTATION_FRONTEND_IMAGE:-sop-annotation-frontend:latest}
    build:
      context: ./microservices/video-annotator-ms/annotation_frontend
      dockerfile: Dockerfile
    container_name: sop-annotation-frontend
    ports:
      - "${FRONTEND_PORT:-80}:${FRONTEND_PORT:-80}"
    networks:
      - sop-network
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - annotation-backend

  metadata_db:
    image: postgres:17.2
    shm_size: 256mb
    volumes:
      - ${POSTGRES_DB_ROOT:-postgres_db}:/var/lib/postgresql/data
      - ./db-init-scripts/01-init-tables.sql:/docker-entrypoint-initdb.d/01-init-tables.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sop_db}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-64MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-4MB}
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
    restart: always
    networks:
      - sop-network

  adminer:
    image: adminer
    ports:
      - 8080:8080
    restart: always
    networks:
      - sop-network


networks:
  sop-network:
    driver: bridge

volumes:
  config:
  data:
  pretrained_weights:
  results:
  logs:
  postgres_db:
  tools: